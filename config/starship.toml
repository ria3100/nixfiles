add_newline = false

# 表示する項目だけを並べる（ほかの項目の検出処理を走らせない）。
# git_status や言語のバージョン（nodejs など）はファイルの検出やコマンドの実行で遅くなるので入れない
format = """\
  $username\
  $directory\
  $git_branch\
  $nix_shell\
  $cmd_duration\
  $line_break\
  $jobs\
  $character\
  """

[character]
success_symbol = "[❯](bold fg:79)"
error_symbol = "[❯](bold fg:170)"
vicmd_symbol = "[❮](bold fg:79)"

[directory]
truncate_to_repo = false

# 開発環境の名前（mkShell の name）は付けていないので出さない
[nix_shell]
format = 'via [$symbol$state]($style) '
